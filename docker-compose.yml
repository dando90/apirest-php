services:
  app:
    build: .
    ports:
      - "${PLAYGROUND_PORT:-8080}:80"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: apirest_demo
      DB_USERNAME: apirest_demo
      DB_PASSWORD: local_demo_only_password
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: apirest_demo
      MYSQL_USER: apirest_demo
      MYSQL_PASSWORD: local_demo_only_password
      MYSQL_ROOT_PASSWORD: local_root_only_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migration.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
